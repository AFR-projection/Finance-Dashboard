# Fail2Ban jail for Ledgerly
#
# Install:
#   sudo cp deploy/fail2ban/filter.d/ledgerly-auth.conf /etc/fail2ban/filter.d/
#   sudo cp deploy/fail2ban/jail.d/ledgerly.conf /etc/fail2ban/jail.d/
#   sudo systemctl enable --now fail2ban
#   sudo fail2ban-client reload

[ledgerly-auth]
enabled  = true
port     = http,https
filter   = ledgerly-auth
logpath  = /var/log/nginx/ledgerly.access.log
maxretry = 12
findtime = 10m
bantime  = 1h
action   = iptables-multiport[name=ledgerly-auth, port="http,https"]
