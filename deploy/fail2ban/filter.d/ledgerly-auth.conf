# Fail2Ban filter — brute force on Ledgerly login APIs (via Nginx access log)
#
# Detects repeated 401/429 on /api/auth/login-challenge and /api/auth/*

[Definition]
failregex = ^<HOST> .* "(POST|GET) /api/auth/(login-challenge|login-ticket|login-confirm|callback/credentials|register) .*" (401|403|429)
ignoreregex =
