# CONTOH SAJA — JANGAN dipasang langsung.
#
# install.sh / update.sh sudah generate config yang benar (dengan APP_PORT hasil
# pilihan otomatis) ke deploy/generated/nginx-ledgerly.conf, lalu memasangnya
# sendiri ke /etc/nginx/ dan menjalankan certbot.
#
# Port 3000 di bawah ini TIDAK cocok dengan default deploy (3047) — memasang file
# ini apa adanya menghasilkan 502 Bad Gateway.
#
# Kalau perlu pasang manual, pakai yang sudah digenerate:
#   sudo cp deploy/generated/nginx-ledgerly.conf /etc/nginx/sites-available/ledgerly
#   sudo ln -sf /etc/nginx/sites-available/ledgerly /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream ledgerly_upstream {
    server 127.0.0.1:3000;  # ganti sesuai APP_PORT di .env
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 20M;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://ledgerly_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    location /socket.io/ {
        proxy_pass http://ledgerly_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    access_log /var/log/nginx/ledgerly.access.log;
    error_log  /var/log/nginx/ledgerly.error.log;
}
