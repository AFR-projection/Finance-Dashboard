# Ledgerly — Docker Compose (Neon external + Redis internal)
#
# Internet → Nginx (:443) → app (APP_PORT host)
#                        ↘ redis (internal)
# Neon PostgreSQL (external — DATABASE_URL di .env)
#
# Install: ./install.sh
# Rebuild: ./deploy.sh
# Update:  ./update.sh

name: ledgerly

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - ledgerly_net

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # Dummy cukup untuk build; runtime pakai env_file DATABASE_URL (Neon)
        DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build?schema=public
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3047}:3000"
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      TELEGRAM_EMBEDDED: "0"
      DOCKER: "1"
      SKIP_DB_PUSH: "0"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ledgerly_net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    # entrypoint: prisma db push → server.ts

  telegram-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build?schema=public
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: http://app:3000
      DOCKER: "1"
      SKIP_DB_PUSH: "1"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - ledgerly_net
    entrypoint: ["npx", "tsx", "workers/telegram/index.ts"]

  whatsapp-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build?schema=public
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: http://app:3000
      WHATSAPP_AUTH_DIR: /data/wa-auth
      DOCKER: "1"
      SKIP_DB_PUSH: "1"
    volumes:
      - wa_auth:/data/wa-auth
    depends_on:
      app:
        condition: service_healthy
    networks:
      - ledgerly_net
    entrypoint: ["npx", "tsx", "workers/whatsapp/index.ts"]

volumes:
  redis_data:
  wa_auth:

networks:
  ledgerly_net:
    driver: bridge
    name: ledgerly_net
