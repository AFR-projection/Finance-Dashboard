# Ledgerly — Docker Compose (Neon external + Redis internal)
#
# Paths relatif ke PROJECT ROOT (/opt/ledgerly), bukan ke folder docker/.
# install.sh / deploy.sh memanggil:
#   docker compose -f "$ROOT/docker/docker-compose.yml" --project-directory "$ROOT" --env-file "$ROOT/.env"
#
# Install: ./install.sh
# Rebuild: ./deploy.sh
# Update:  ./update.sh

name: ledgerly

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - ledgerly_net
    logging: *default-logging

  app:
    build:
      # IMPORTANT: context = project root (bukan "..") supaya tidak resolve ke /opt
      context: .
      dockerfile: docker/Dockerfile
      args:
        # Dummy cukup untuk build; runtime pakai env_file DATABASE_URL (Neon)
        DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build?schema=public
    restart: unless-stopped
    ports:
      # Bind ke loopback: hanya Nginx yang boleh menjangkau app.
      # Tanpa domain (akses via http://IP:PORT), set APP_BIND=0.0.0.0 di .env.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3047}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      TELEGRAM_EMBEDDED: "0"
      DOCKER: "1"
      SKIP_DB_PUSH: "0"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ledgerly_net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    logging: *default-logging

  telegram-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build?schema=public
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: http://app:3000
      DOCKER: "1"
      SKIP_DB_PUSH: "1"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - ledgerly_net
    entrypoint: ["npx", "tsx", "workers/telegram/index.ts"]
    logging: *default-logging

  # Penjadwalan laporan proaktif. Prosesnya sendiri, bukan interval di dalam app:
  # interval di web akan berjalan dua kali begitu ada instance kedua, dan restart
  # tiap deploy. Sebelumnya service ini hilang dari compose sementara PM2 punya —
  # itu sebabnya heartbeat tidak pernah jalan di produksi.
  heartbeat-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build?schema=public
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: http://app:3000
      DOCKER: "1"
      SKIP_DB_PUSH: "1"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - ledgerly_net
    entrypoint: ["npx", "tsx", "workers/heartbeat/index.ts"]
    logging: *default-logging

volumes:
  redis_data:

networks:
  ledgerly_net:
    driver: bridge
    name: ledgerly_net
