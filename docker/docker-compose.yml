# Ledgerly — Docker Compose (aman di VPS yang sudah ramai)
#
# Hanya publish 1 port ke host: APP_PORT (dipilih ./deploy.sh)
# Postgres & Redis INTERNAL → tidak tabrakan dengan project lain.
#
# Start: ./deploy.sh

name: ledgerly

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ledgerly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgerly_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-ledgerly}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ledgerly} -d ${POSTGRES_DB:-ledgerly}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ledgerly_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - ledgerly_net

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3047}:3000"
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-ledgerly}:${POSTGRES_PASSWORD:-ledgerly_secret_change_me}@postgres:5432/${POSTGRES_DB:-ledgerly}
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://127.0.0.1:3047}
      AUTH_URL: ${AUTH_URL:-http://127.0.0.1:3047}
      WHATSAPP_WORKER_SECRET: ${WHATSAPP_WORKER_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      AUTH_SECRET: ${AUTH_SECRET}
      TELEGRAM_EMBEDDED: "0"
      DOCKER: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ledgerly_net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    command: sh -c "npx prisma db push && npx tsx server.ts"

  telegram-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ledgerly}:${POSTGRES_PASSWORD:-ledgerly_secret_change_me}@postgres:5432/${POSTGRES_DB:-ledgerly}
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: http://app:3000
      WHATSAPP_WORKER_SECRET: ${WHATSAPP_WORKER_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      DOCKER: "1"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - ledgerly_net
    command: npx tsx workers/telegram/index.ts

  whatsapp-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ledgerly}:${POSTGRES_PASSWORD:-ledgerly_secret_change_me}@postgres:5432/${POSTGRES_DB:-ledgerly}
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: http://app:3000
      WHATSAPP_WORKER_SECRET: ${WHATSAPP_WORKER_SECRET}
      WHATSAPP_AUTH_DIR: /data/wa-auth
      WHATSAPP_OWNER_USER_ID: ${WHATSAPP_OWNER_USER_ID:-}
      DOCKER: "1"
    volumes:
      - wa_auth:/data/wa-auth
    depends_on:
      app:
        condition: service_healthy
    networks:
      - ledgerly_net
    command: npx tsx workers/whatsapp/index.ts

volumes:
  postgres_data:
  redis_data:
  wa_auth:

networks:
  ledgerly_net:
    driver: bridge
    name: ledgerly_net
